<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chem Lab</title>
<style>
  :root { --bg:#12161f; --panel:#181e2a; --line:#2a3344; --text:#dfe6f2; --dim:#8b97ab; --accent:#5fb3ff; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }
  aside { width:260px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:5; }
  aside header { padding:14px 14px 10px; border-bottom:1px solid var(--line); }
  aside h1 { margin:0 0 8px; font-size:16px; letter-spacing:.3px; }
  #search { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#0f131b; color:var(--text); font:inherit; }
  #catalog { overflow:auto; flex:1; padding:6px 8px 12px; }
  details { margin:4px 0; }
  summary { cursor:pointer; padding:8px 6px; font-weight:600; color:var(--dim); text-transform:uppercase; font-size:11px; letter-spacing:.8px; display:flex; justify-content:space-between; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary span { opacity:.6; }
  .row { display:flex; align-items:center; gap:4px; }
  .info { flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:none; color:var(--dim); font:italic 600 13px Georgia,serif; cursor:pointer; }
  .info:hover, .info:focus-visible { color:var(--text); border-color:var(--accent); }
  .item { display:block; flex:1; min-width:0; text-align:left; background:none; border:0; color:var(--text); padding:7px 10px; border-radius:7px; cursor:pointer; font:inherit; }
  .item:hover, .item:active { background:#232c3d; }
  aside footer { padding:10px; border-top:1px solid var(--line); display:flex; gap:8px; }
  aside footer button { flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:#0f131b; color:var(--text); font:inherit; cursor:pointer; }
  main { position:relative; flex:1; min-width:0; }
  #lab { width:100%; height:100%; display:block; touch-action:none; }
  #hint { position:absolute; left:14px; top:10px; color:var(--dim); font-size:12px; pointer-events:none; max-width:calc(100% - 200px); }
  #menu { display:none; position:absolute; left:10px; top:10px; z-index:6; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:18px; }
  #bin { position:absolute; right:14px; bottom:14px; width:52px; height:52px; border-radius:12px; display:grid; place-items:center; font-size:24px; background:rgba(0,0,0,.25); border:1px dashed #4a5568; transition:.15s; pointer-events:none; }
  #bin.hot { background:rgba(220,60,60,.35); border-color:#f66; transform:scale(1.12); }
  #rot { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:12px; opacity:.35; transition:.2s; }
  #rot.on { opacity:1; }
  #rot button { width:54px; height:54px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:22px; touch-action:none; }
  #tip { position:fixed; z-index:20; max-width:320px; min-width:220px; padding:12px 14px; border-radius:12px; background:rgba(16,20,29,.94); border:1px solid #33405a; box-shadow:0 10px 30px rgba(0,0,0,.45); backdrop-filter:blur(6px); pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .45s, transform .45s; font-size:12.5px; }
  #tip.show { opacity:1; transform:none; }
  .t-title { font-weight:700; font-size:14px; margin-bottom:4px; }
  .t-haz { color:#ff9b8f; font-size:11.5px; margin-bottom:6px; }
  .t-grid { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:6px 0; }
  .t-grid span { color:var(--dim); } .t-grid i { color:var(--dim); font-style:normal; font-weight:400; }
  .t-h { margin:8px 0 3px; color:var(--accent); font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; }
  #tip ul { list-style:none; margin:0; padding:0; }
  #tip li { display:flex; align-items:center; gap:6px; padding:1.5px 0; }
  #tip li em { margin-left:auto; font-style:normal; color:var(--dim); padding-left:10px; white-space:nowrap; }
  #tip ul.eq li { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; border:1px solid rgba(255,255,255,.3); }
  .dot.clear { background:transparent; }
  .t-note { margin-top:8px; padding-top:7px; border-top:1px solid #2a3344; color:#cfd8e6; font-size:11.5px; }
  .t-empty { color:var(--dim); }
  .t-foot { margin-top:8px; color:var(--dim); font-size:10.5px; }
  #speed { position:absolute; right:14px; top:30px; display:flex; gap:4px; }
  #speed button { padding:4px 8px; border-radius:7px; border:1px solid var(--line); background:var(--panel); color:var(--dim); font:12px system-ui; cursor:pointer; }
  #speed button.on { color:var(--text); border-color:var(--accent); }
  #wiki { position:fixed; z-index:30; top:0; right:0; bottom:0; width:min(400px,100%); background:var(--panel); border-left:1px solid var(--line); box-shadow:-8px 0 30px rgba(0,0,0,.4); display:flex; flex-direction:column; }
  #wiki .bar { display:flex; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--line); }
  #wiki .bar button { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:5px 10px; font:inherit; cursor:pointer; }
  #wiki-body { overflow:auto; padding:6px 18px 24px; }
  #wiki h2 { margin:12px 0 2px; font-size:19px; display:flex; align-items:center; gap:8px; }
  #wiki h3 { margin:18px 0 6px; font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--accent); }
  #wiki .sub { margin:0 0 10px; color:var(--dim); }
  #wiki p { margin:8px 0; }
  #wiki a { color:var(--accent); text-decoration:none; } #wiki a:hover { text-decoration:underline; }
  #wiki ul { list-style:none; padding:0; margin:0; }
  #wiki .list li { padding:4px 0; border-bottom:1px solid #222a38; display:flex; gap:8px; }
  #wiki .list em { margin-left:auto; color:var(--dim); font-style:normal; }
  #wiki .eqs li { padding:7px 0; border-bottom:1px solid #222a38; display:flex; flex-direction:column; gap:2px; }
  #wiki code { font:12.5px ui-monospace,Menlo,monospace; color:#e8eefc; }
  #wiki .eqs span { color:var(--dim); font-size:12px; }
  #wiki .eqs .parts a { font-size:12px; }
  #wiki .sw { width:16px; height:16px; border-radius:4px; border:1px solid rgba(255,255,255,.3); }
  #wiki .ext { display:inline-block; margin-top:18px; }
  @media (max-width:760px) {
    aside { position:absolute; inset:0 auto 0 0; width:82%; max-width:300px; transform:translateX(-100%); transition:transform .25s; box-shadow:4px 0 20px rgba(0,0,0,.4); }
    body.side-open aside { transform:none; }
    #menu { display:block; }
    #hint { left:60px; top:14px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>⚗️ Chem Lab</h1>
      <input id="search" placeholder="Search compounds & glassware…" autocomplete="off">
    </header>
    <div id="catalog"></div>
    <footer><button id="clear">Clear bench</button></footer>
  </aside>
  <main>
    <canvas id="lab"></canvas>
    <button id="menu" aria-label="Catalog">☰</button>
    <div id="hint">Drag glassware · hold it above another container to pour (or tilt with scroll / Q·E / ⟲⟳) · hover to inspect · tap for the wiki · tap a burner or hot plate to switch it on · drop on 🗑 to discard</div>
    <div id="rot"><button id="rotL" aria-label="Tilt left">⟲</button><button id="rotR" aria-label="Tilt right">⟳</button></div>
    <div id="bin">🗑</div>
    <div id="speed" role="group" aria-label="Time speed"><button data-s="1" class="on">×1</button><button data-s="10">×10</button><button data-s="60">×60</button></div>
  </main>
</div>
<div id="tip"></div>
<div id="wiki" hidden><div class="bar"><button id="wiki-back" hidden>← Back</button><span></span><button id="wiki-close">Close ✕</button></div><div id="wiki-body"></div></div>
<script src="js/chem.js"></script>
<script src="js/lab.js"></script>
</body>
</html>
